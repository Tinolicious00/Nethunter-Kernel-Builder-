name: "NetHunter Kernel Builder (Ultra)"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_MAXSIZE: "3G"
  ANYKERNEL3_REPO: "https://github.com/osm0sis/AnyKernel3"
  ANYKERNEL3_BRANCH: "master"
  ARCH: "arm64"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: force a specific release tag (e.g., v1.2.3)'
        required: false
        default: ''
      build_type:
        description: 'Build flavour'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - experimental
      clean_build:
        description: 'Force clean build (disable ccache)'
        required: true
        default: false
        type: boolean
      apply_patches:
        description: 'Apply patches from ./patches/ folder'
        required: true
        default: true
        type: boolean

jobs:
  parse-config:
    name: "📄 Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: "🔽 Checkout workflow"
        uses: actions/checkout@v4

      - name: "📊 Generate Matrix"
        id: generate-matrix
        run: |
          set -euo pipefail
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          cat "${{ env.CONFIGURATION }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "matrix=$(cat "${{ env.CONFIGURATION }}" | jq -c .)" >> $GITHUB_OUTPUT

  build-kernel:
    name: "🐎 ${{ matrix.repos.kernelSource.device }} | ${{ matrix.repos.kernelSource.name }}"
    runs-on: ubuntu-latest
    needs: parse-config
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.parse-config.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}

      # Use custom defconfig from repos.json if provided, else device_defconfig
      DEFCONFIG_NAME: ${{ matrix.repos.params.DEFCONFIG || format('{0}_defconfig', matrix.repos.kernelSource.device) }}

      withKernelSU: ${{ matrix.repos.withKernelSU }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag }}
      CLEAN_BUILD: ${{ github.event.inputs.clean_build == 'true' }}
      APPLY_PATCHES: ${{ github.event.inputs.apply_patches == 'true' }}
      IS_MANIFEST: ${{ matrix.repos.kernelSource.manifest || false }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      ZIP_NAME: ""

    steps:
      - name: "🧹 Clean workspace"
        run: |
          set -euo pipefail
          rm -rf "${{ env.kernelDir }}"
          mkdir -p "${{ env.kernelDir }}"
          echo "Workspace cleaned."

      - name: "📦 Install prerequisites"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc curl git zip ftp libssl-dev lftp zstd wget \
            libfl-dev python3 python-is-python3 libarchive-tools jq \
            ccache tree time
          for tool in make git ccache jq patch curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "❌ Required tool '$tool' not found."
              exit 1
            fi
          done
          echo "✅ All prerequisites installed."

      - name: "🔄 Install repo tool"
        if: ${{ env.IS_MANIFEST == 'true' }}
        run: |
          set -euo pipefail
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo
          repo --version
          echo "✅ repo installed."

      - name: "📥 Sync manifest source (repo) – with retry"
        if: ${{ env.IS_MANIFEST == 'true' }}
        working-directory: ./${{ env.kernelDir }}
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            echo "Attempt $attempt to sync manifest..."
            repo init -u "${{ env.kernelRepo }}" -b "${{ env.kernelBranch }}" --depth=1
            repo sync -c -j$(nproc) --no-tags && break
            if [ $attempt -eq 3 ]; then
              echo "❌ repo sync failed after 3 attempts."
              exit 1
            fi
            echo "Retrying in 10 seconds..."
            sleep 10
          done
          echo "✅ repo sync completed successfully."

      - name: "🔍 Get remote commit hash (non‑manifest)"
        id: remote_hash
        if: ${{ env.IS_MANIFEST != 'true' }}
        run: |
          set -euo pipefail
          HASH=$(git ls-remote "${{ env.kernelRepo }}" "${{ env.kernelBranch }}" | cut -f1)
          if [ -z "$HASH" ]; then
            echo "❌ Could not get remote commit hash for ${{ env.kernelRepo }} branch ${{ env.kernelBranch }}"
            exit 1
          fi
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "✅ Remote hash: $HASH"

      - name: "📦 Cache kernel source (non‑manifest)"
        id: cache-source
        if: ${{ env.IS_MANIFEST != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.kernelDir }}/${{ matrix.repos.kernelSource.name }}
          key: source-${{ steps.remote_hash.outputs.hash }}
          restore-keys: |
            source-${{ steps.remote_hash.outputs.hash }}-

      - name: "📥 Clone kernel source (non‑manifest, if not cached)"
        if: ${{ env.IS_MANIFEST != 'true' && steps.cache-source.outputs.cache-hit != 'true' }}
        working-directory: ./${{ env.kernelDir }}
        run: |
          set -euo pipefail
          git clone --recursive --branch "${{ env.kernelBranch }}" "${{ env.kernelRepo }}" "${{ matrix.repos.kernelSource.name }}" --depth=1
          echo "✅ Kernel source cloned."

      - name: "🔁 Restore source from cache (non‑manifest)"
        if: ${{ env.IS_MANIFEST != 'true' && steps.cache-source.outputs.cache-hit == 'true' }}
        run: echo "✅ Source restored from cache."

      # ------------------------------------------------------------
      # NEW: List available defconfigs to verify the correct name
      # ------------------------------------------------------------
      - name: "📋 List available defconfigs"
        working-directory: ./${{ env.kernelDir }}
        run: |
          set -euo pipefail
          echo "Available defconfigs for arm64:"
          find . -path "*/arch/arm64/configs/*_defconfig" -type f | sort
          echo "Defconfig we will use: ${{ env.DEFCONFIG_NAME }}"

      # ------------------------------------------------------------
      # ULTRA‑ROBUST KERNEL ROOT DETECTION (fixed)
      # ------------------------------------------------------------
      - name: "📂 Find kernel root"
        id: find_root
        working-directory: ./${{ env.kernelDir }}
        run: |
          set -euo pipefail
          echo "Listing contents of $(pwd):"
          ls -la

          DEFCONFIG="${{ env.DEFCONFIG_NAME }}"
          echo "Looking for defconfig: $DEFCONFIG"

          # First, print contents of likely directories for debugging
          for dir in kernel common gs aosp; do
            if [ -d "$dir" ]; then
              echo "Contents of $dir:"
              ls -la "$dir" 2>/dev/null || echo "  (cannot list)"
            fi
          done

          # Search for the defconfig file anywhere
          echo "Searching for $DEFCONFIG..."
          DEFCONFIG_PATHS=$(find . -type f -name "$DEFCONFIG" 2>/dev/null || true)
          if [ -z "$DEFCONFIG_PATHS" ]; then
            echo "❌ Defconfig $DEFCONFIG not found anywhere in $(pwd)"
            echo "Full directory tree (max depth 4):"
            find . -maxdepth 4 -type d | sort
            echo "Searching for any file ending with 'defconfig':"
            find . -name "*defconfig" | head -20
            exit 1
          fi
          echo "Found defconfig at:"
          echo "$DEFCONFIG_PATHS"

          # Determine the kernel root for each found path
          KERNEL_ROOT=""
          for path in $DEFCONFIG_PATHS; do
            # The path is like ./some/dir/arch/arm64/configs/ravioledefconfig
            # We want the directory that contains both arch/ and Makefile
            # Go up until we find a directory that has arch/ and Makefile
            current_dir=$(dirname "$path")
            while [ "$current_dir" != "." ] && [ "$current_dir" != "/" ]; do
              if [ -d "$current_dir/arch" ] && [ -f "$current_dir/Makefile" ]; then
                KERNEL_ROOT="$current_dir"
                break
              fi
              current_dir=$(dirname "$current_dir")
            done
            if [ -n "$KERNEL_ROOT" ]; then
              echo "Found root for defconfig at $path: $KERNEL_ROOT"
              break
            fi
          done

          # If still not found, try a simpler approach: look for any directory containing both Makefile and arch/$ARCH/configs/
          if [ -z "$KERNEL_ROOT" ]; then
            echo "Falling back to searching for directories with Makefile and arch/${{ env.ARCH }}/configs/"
            for dir in $(find . -maxdepth 4 -type f -name Makefile -exec dirname {} \; | sort -u); do
              if [ -d "$dir/arch/${{ env.ARCH }}/configs" ] && [ -f "$dir/arch/${{ env.ARCH }}/configs/$DEFCONFIG" ]; then
                KERNEL_ROOT="$dir"
                echo "Found root via fallback: $dir"
                break
              fi
            done
          fi

          # If we have a root, verify and set it
          if [ -z "$KERNEL_ROOT" ]; then
            echo "❌ Could not determine kernel root."
            echo "List of directories containing Makefile:"
            find . -name Makefile -exec dirname {} \; | sort -u
            echo "List of directories containing arch/${{ env.ARCH }}/configs/$DEFCONFIG:"
            find . -path "*/arch/${{ env.ARCH }}/configs/$DEFCONFIG" -exec dirname {} \; | sort -u
            exit 1
          fi

          # Remove leading './'
          KERNEL_ROOT=${KERNEL_ROOT#./}
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV
          echo "kernel_root=$KERNEL_ROOT" >> $GITHUB_OUTPUT
          echo "✅ Kernel root found: $KERNEL_ROOT"

      - name: "🔍 Verify kernel source"
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        run: |
          set -euo pipefail
          if [ ! -f "Makefile" ]; then
            echo "❌ Kernel source invalid: Makefile not found in $(pwd)"
            exit 1
          fi
          if [ ! -f "arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}" ]; then
            echo "❌ Defconfig ${{ env.DEFCONFIG_NAME }} not found in arch/${{ env.ARCH }}/configs/"
            exit 1
          fi
          echo "✅ Kernel source looks valid."

      # ---- Continue with the rest of the steps (unchanged) ----
      - name: "🔖 Generate kernel version"
        id: version
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        run: |
          set -euo pipefail
          if [ -n "${{ env.RELEASE_TAG }}" ]; then
            VERSION="${{ env.RELEASE_TAG }}"
          else
            if git describe --always --tags --dirty >/dev/null 2>&1; then
              VERSION=$(git describe --always --tags --dirty)
            else
              COMMIT_HASH=$(git rev-parse --short HEAD)
              DATE=$(date +%Y%m%d)
              VERSION="build-${DATE}-g${COMMIT_HASH}"
            fi
          fi
          if [ "${{ env.BUILD_TYPE }}" != "release" ]; then
            VERSION="${VERSION}-${{ env.BUILD_TYPE }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ Version: $VERSION"

      - name: "💾 Cache toolchains"
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.kernelDir }}/clang
            ${{ env.kernelDir }}/gas
          key: toolchains-${{ join(matrix.repos.toolchains.*.branch, '-') }}
          restore-keys: |
            toolchains-

      - name: "🔧 Get toolchains (if not cached)"
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        working-directory: ./${{ env.kernelDir }}
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          set -euo pipefail
          toolchains_num="$(echo $toolchains | jq 'length')"
          for ((i=0;i<toolchains_num;i++)); do
            name=$(echo $toolchains | jq -r ".[$i].name")
            repo=$(echo $toolchains | jq -r ".[$i].repo")
            branch=$(echo $toolchains | jq -r ".[$i].branch")
            echo "Cloning $name from $repo branch $branch"
            git clone --recursive --branch "$branch" "$repo" "$name" --depth=1
          done
          echo "✅ Toolchains downloaded."

      - name: "🌳 Add toolchains to PATH"
        working-directory: ./${{ env.kernelDir }}
        run: |
          set -euo pipefail
          for dir in clang gas; do
            if [ -d "$dir" ]; then
              echo "$(pwd)/$dir/" >> $GITHUB_PATH
              echo "$(pwd)/$dir/bin" >> $GITHUB_PATH
            fi
          done
          echo "✅ Toolchains added to PATH."

      - name: "🩹 Apply custom patches"
        if: ${{ env.APPLY_PATCHES == 'true' }}
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        run: |
          set -euo pipefail
          PATCH_DIR="${{ github.workspace }}/patches"
          if [ -d "$PATCH_DIR" ]; then
            for patch in $(find "$PATCH_DIR" -name "*.patch" | sort); do
              echo "Applying $patch"
              patch -p1 < "$patch" || { echo "❌ Patch $patch failed"; exit 1; }
            done
          else
            echo "No patches folder found, skipping."
          fi
          echo "✅ Patches applied (if any)."

      - name: "⚙️ Set build arguments"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
          extraParams: "${{ toJSON(matrix.repos.extraParams) }}"
        run: |
          set -euo pipefail
          ARCH=$(echo "$params" | jq -r ".ARCH // empty")
          CROSS_COMPILE=$(echo "$params" | jq -r ".CROSS_COMPILE // empty")
          CROSS_COMPILE_COMPAT=$(echo "$params" | jq -r ".CROSS_COMPILE_COMPAT // empty")
          CLANG_TRIPLE=$(echo "$params" | jq -r ".CLANG_TRIPLE // empty")
          AR=$(echo "$params" | jq -r ".AR // empty")
          CC=$(echo "$params" | jq -r ".CC // empty")
          LD=$(echo "$params" | jq -r ".LD // empty")
          LLVM=$(echo "$params" | jq -r ".LLVM // empty")
          LLVM_IAS=$(echo "$params" | jq -r ".LLVM_IAS // empty")
          TARGET=$(echo "$params" | jq -r ".TARGET // empty")

          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV

          if command -v ccache >/dev/null 2>&1 && [ "${{ env.CLEAN_BUILD }}" != "true" ]; then
            export CCACHE_DIR="${{ env.CCACHE_DIR }}"
            export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
            ccache -z
            CC="ccache $CC"
            echo "✅ ccache enabled."
          else
            echo "⚠️ ccache not used (clean build or missing)."
          fi

          args="-j$(nproc --all) -s"
          args="$args O=../${{ env.OUT_DIR }}"
          [ -n "$ARCH" ] && args="$args ARCH=$ARCH"
          [ -n "$CROSS_COMPILE" ] && args="$args CROSS_COMPILE=$CROSS_COMPILE"
          [ -n "$CLANG_TRIPLE" ] && args="$args CLANG_TRIPLE=$CLANG_TRIPLE"
          [ -n "$CROSS_COMPILE_COMPAT" ] && args="$args CROSS_COMPILE_ARM32=$CROSS_COMPILE_COMPAT"
          [ -n "$TARGET" ] && args="$args $TARGET"

          extra_params=""
          if [ -n "$extraParams" ] && [ "$extraParams" != "null" ]; then
            extra_params=$(echo "$extraParams" | jq -r 'to_entries[]? | select(.value != "") | "\(.key)=\(.value)"' | tr "\n" " " | sed 's/ $//')
          fi
          echo "args=$args $extra_params" >> $GITHUB_OUTPUT

          echo "CC=$CC" >> $GITHUB_ENV
          echo "LD=$LD" >> $GITHUB_ENV
          echo "AR=$AR" >> $GITHUB_ENV
          echo "NM=$NM" >> $GITHUB_ENV
          echo "OBJCOPY=$OBJCOPY" >> $GITHUB_ENV
          echo "OBJDUMP=$OBJDUMP" >> $GITHUB_ENV
          echo "STRIP=$STRIP" >> $GITHUB_ENV
          echo "LLVM=$LLVM" >> $GITHUB_ENV
          echo "LLVM_IAS=$LLVM_IAS" >> $GITHUB_ENV

      - name: "🔀 Update KernelSU"
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        if: ${{ env.withKernelSU == 'true' }}
        run: |
          set -euo pipefail
          rm -rf ./KernelSU ./drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "✅ KernelSU integrated."

      - name: "📝 Generate defconfig"
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          set -euo pipefail
          make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}
          echo "✅ Defconfig generated."

      - name: "🏴‍☠️ Inject NetHunter configs"
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        run: |
          set -euo pipefail
          cd ../${{ env.OUT_DIR }}
          cat << 'EOF' >> .config
          CONFIG_OF_CONFIGFS=y
          CONFIG_OF_OVERLAY=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_ACM=y
          CONFIG_USB_CONFIGFS_F_ECM=y
          CONFIG_USB_CONFIGFS_F_EEM=y
          CONFIG_USB_CONFIGFS_F_RNDIS=y
          CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_NETFILTER=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_CRYPTO_USER_API_HASH=y
          CONFIG_CRYPTO_USER_API_SKCIPHER=y
          CONFIG_CRYPTO_USER_API_AEAD=y
          CONFIG_CRYPTO_USER_API_RNG=y
          EOF
          make ARCH=${{ env.ARCH }} O=$(pwd) olddefconfig
          echo "✅ NetHunter configs injected."

      - name: "✅ Validate kernel config"
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        run: |
          set -euo pipefail
          cd ../${{ env.OUT_DIR }}
          REQUIRED_CONFIGS="CONFIG_KPROBES CONFIG_NETFILTER CONFIG_USB_GADGET"
          missing=0
          for cfg in $REQUIRED_CONFIGS; do
            if ! grep -q "^$cfg=y" .config; then
              echo "⚠️ Warning: $cfg is not set, NetHunter may be incomplete"
              missing=1
            fi
          done
          [ $missing -eq 0 ] && echo "✅ All required configs are set."

      - name: "🛠️ Build kernel (Image, modules, dtbs)"
        id: build
        working-directory: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          time make ${args}
          time make ${args} modules
          time make ${args} dtbs || echo "No DTBs to build"
          END=$(date +%s)
          DURATION=$((END - START))
          echo "BUILD_DURATION=$DURATION" >> $GITHUB_ENV
          echo "✅ Kernel built in ${DURATION} seconds."

      - name: "📦 Package flashable ZIP"
        id: package
        run: |
          set -euo pipefail
          git clone --depth=1 "${{ env.ANKERNEL3_REPO }}" -b "${{ env.ANKERNEL3_BRANCH }}" AnyKernel3
          IMAGE_PATH="./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "❌ Image not found at $IMAGE_PATH"
            exit 1
          fi
          cp "$IMAGE_PATH" AnyKernel3/
          [ -f "./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb" ] && cp "./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb" AnyKernel3/
          [ -f "./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img" ] && cp "./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img" AnyKernel3/
          cd AnyKernel3
          sed -i "s/device.name1=.*/device.name1=${{ env.kernelDevice }}/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=${{ env.kernelDevice }}/" anykernel.sh
          ZIP_NAME="${{ env.kernelDevice }}-NetHunter-Kernel-${{ steps.version.outputs.version }}.zip"
          zip -9 -r ../"$ZIP_NAME" * -x .git README.md
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Flashable ZIP created: $ZIP_NAME"

      - name: "⬆️ Upload kernel Image"
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-${{ env.kernelDevice }}
          path: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: "⬆️ Upload kernel modules"
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Modules-${{ env.kernelDevice }}
          path: ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/**/*.ko
          if-no-files-found: warn
          retention-days: 7

      - name: "⬆️ Upload flashable ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: Flashable-ZIP-${{ env.kernelDevice }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: "📤 Upload debug info on failure"
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p debug
          if [ -f "./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/.config" ]; then
            cp "./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/.config" debug/
          fi
          find ./${{ env.kernelDir }} -name "*.log" -exec cp {} debug/ \; 2>/dev/null || true
          tree ./${{ env.kernelDir }} > debug/tree.txt 2>/dev/null || ls -laR ./${{ env.kernelDir }} > debug/tree.txt
          tar -czf debug.tar.gz debug/
        continue-on-error: true

      - name: "⬆️ Upload debug archive"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ env.kernelDevice }}
          path: debug.tar.gz
          retention-days: 7

      - name: "📊 Build statistics"
        if: success()
        run: |
          set -euo pipefail
          echo "## Build report for ${{ env.kernelDevice }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build type**: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Defconfig**: ${{ env.DEFCONFIG_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU**: ${{ env.withKernelSU }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image size**: $(du -h ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image | cut -f1)" >> $GITHUB_STEP_SUMMARY
          MOD_COUNT=$(find ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }} -name "*.ko" | wc -l)
          echo "- **Modules count**: $MOD_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Build duration**: ${BUILD_DURATION:-unknown} seconds" >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY

      - name: "🏷️ Create GitHub Release"
        if: ${{ env.RELEASE_TAG != '' && github.event_name == 'workflow_dispatch' && success() }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NetHunter Kernel ${{ steps.version.outputs.version }} for ${{ env.kernelDevice }}"
          body: |
            ## Automated build
            - **Version**: `${{ steps.version.outputs.version }}`
            - **Device**: `${{ env.kernelDevice }}`
            - **Source**: `${{ env.kernelRepo }}` (branch `${{ env.kernelBranch }}`)
            - **Defconfig**: `${{ env.DEFCONFIG_NAME }}`
            - **KernelSU**: ${{ env.withKernelSU }}
            - **Build type**: ${{ env.BUILD_TYPE }}
          draft: false
          prerelease: ${{ env.BUILD_TYPE != 'release' }}
          files: |
            ${{ env.ZIP_NAME }}
            ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
        continue-on-error: true

      - name: "📣 Send success notification (Telegram)"
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ **Build succeeded**
            Device: `${{ env.kernelDevice }}`
            Version: `${{ steps.version.outputs.version }}`
            Type: `${{ env.BUILD_TYPE }}`
            Download: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: "📣 Send failure notification (Telegram)"
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **Build failed**
            Device: `${{ env.kernelDevice }}`
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: "📢 Discord notification (on success)"
        if: success() && env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          title: "✅ Kernel build succeeded"
          description: "**Device:** ${{ env.kernelDevice }}\n**Version:** ${{ steps.version.outputs.version }}"
          color: 0x00ff00

      - name: "📢 Discord notification (on failure)"
        if: failure() && env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          title: "❌ Kernel build failed"
          description: "**Device:** ${{ env.kernelDevice }}\n**Error:** Check logs"
          color: 0xff0000

      - name: "🧹 Cleanup build directories"
        if: always()
        run: |
          set -euo pipefail
          rm -rf ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/**/*.o
          rm -rf ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/**/*.cmd
          rm -rf ./${{ env.kernelDir }}/${{ steps.find_root.outputs.kernel_root }}/../${{ env.OUT_DIR }}/**/built-in.a
          ccache -s
